<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Contact Us</title>
    <link rel="stylesheet" href="w2.css" />
  </head>
  <body style="background-color: rgb(216, 227, 227)">
    <div class="upper">
      <h3>Frequently asked Question (FQAs)</h3>
      <br />
      <p>Visit this see the frequently asked question</p>
      <br />
      <button>Visit FAQ</button><br />
    </div>

    <div class="big">
      <div class="side">
        <h3>Submit Support Ticket</h3>
        <br />
        <label for="first-name">First Name:</label>
        <input
          type="text"
          id="first-name"
          name="first_name"
          placeholder="Enter your first name"
        /><br /><br />
        <label for="last-name">Last Name:</label>
        <input
          type="text"
          id="last-name"
          name="last_name"
          placeholder="Enter your Last name"
        />
        <br /><br />
        Email: <input type="email" placeholder="Email" /><br /><br />
        <label for="message">Message:</label><br />
        <textarea id="message" name="message" rows="4" cols="50"></textarea
        ><br /><br />
      </div>

      <div class="side">
        <h3>Live Chat</h3>
        <br />
        <p>
          If you have an urgen technical questions or questions regarding
          payments? Please click here for immediate assistance?
        </p>
        <br />
        <button>Start Chat</button>
      </div>
    </div>
  </body>
</html>
